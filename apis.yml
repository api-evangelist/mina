aid: mina
name: Mina
description: >-
  Mina Protocol is a lightweight, layer-1 blockchain powered by zero-knowledge
  proofs (zk-SNARKs) that keeps the entire chain a constant ~22KB in size so any
  device can sync and verify the network. Developers build privacy-preserving
  smart contracts called zkApps using o1js, a TypeScript zk framework, and the
  mina-signer library for offline transaction signing. Each Mina daemon (node)
  exposes a GraphQL API on localhost:3085 for querying node/account/chain state
  and submitting payments, delegations, and zkApp commands; a Rosetta interface
  and Archive Node support exchange integration and historical data. Mina uses
  the Ouroboros Samasika proof-of-stake consensus and is stewarded by the Mina
  Foundation and o1Labs. Surfaced as a portfolio company of pantera-capital.
